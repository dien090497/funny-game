services:
  - type: web
    name: funny-game
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: funny-game-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: funny-game-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: funny-game-db
          property: password

databases:
  - name: funny-game-db
    plan: free
    databaseName: funnygame
