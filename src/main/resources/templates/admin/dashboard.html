<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý người dùng — Admin</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

  <nav class="admin-nav">
    <div class="brand">
      🎮 <span>Funny Game</span> Admin
    </div>
    <div class="admin-nav-actions">
      <a th:href="@{/}">← Về trang chơi</a>
      <form th:action="@{/logout}" method="post" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Đăng xuất</button>
      </form>
    </div>
  </nav>

  <div class="admin-content">

    <div class="admin-header">
      <h1>Quản lý người dùng</h1>
      <p>Xin chào, <span sec:authentication="name"></span></p>
    </div>

    <div th:if="${error}" class="admin-alert error" th:text="${error}"></div>
    <div th:if="${message}" class="admin-alert success" th:text="${message}"></div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Tổng người dùng</div>
        <div class="stat-value" th:text="${users.size()}">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Player</div>
        <div class="stat-value"
             th:text="${users.stream().filter(u -> u.role.name() == 'PLAYER').count()}">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Đang bị khoá</div>
        <div class="stat-value"
             th:text="${users.stream().filter(u -> !u.enabled).count()}">0</div>
      </div>
    </div>

    <!-- Table -->
    <div class="admin-table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tên đăng nhập</th>
            <th>Vai trò</th>
            <th>Trạng thái</th>
            <th>Ngày tạo</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u, stat : ${users}">
            <td th:text="${stat.index + 1}">1</td>
            <td th:text="${u.username}">username</td>
            <td>
              <span th:if="${u.role.name() == 'ADMIN'}" class="badge badge-admin">ADMIN</span>
              <span th:if="${u.role.name() == 'PLAYER'}" class="badge badge-player">PLAYER</span>
            </td>
            <td>
              <span th:if="${u.enabled}" class="badge badge-player">Hoạt động</span>
              <span th:if="${!u.enabled}" class="badge badge-off">Bị khoá</span>
            </td>
            <td th:text="${#temporals.format(u.createdAt, 'dd/MM/yyyy HH:mm')}">—</td>
            <td>
              <div class="td-actions" th:if="${u.role.name() != 'ADMIN'}">
                <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn-sm"
                          th:text="${u.enabled} ? 'Khoá' : 'Mở khoá'">Khoá</button>
                </form>
                <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                      onsubmit="return confirm('Xoá người dùng này?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn-sm danger">Xoá</button>
                </form>
              </div>
              <span th:if="${u.role.name() == 'ADMIN'}" style="opacity:.35;font-size:.78rem">—</span>
            </td>
          </tr>
          <tr th:if="${users.empty}">
            <td colspan="6" style="text-align:center;opacity:.4;padding:2rem">Chưa có người dùng nào.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
</body>
</html>
