<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">Admin</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-layout">

  <!-- Top bar -->
  <header class="admin-topbar">
    <div class="brand">🎮 Funny Game <em>/ Admin</em></div>
    <div class="admin-topbar-right">
      <span style="font-size:.8rem;opacity:.45" sec:authentication="name"></span>
      <form th:action="@{/logout}" method="post" style="display:inline;margin:0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Đăng xuất</button>
      </form>
    </div>
  </header>

  <div class="admin-body">

    <!-- Sidebar -->
    <nav class="admin-sidebar">
      <div class="sidebar-label">Quản lý</div>
      <a th:href="@{/admin/users}"
         th:classappend="${activeMenu == 'users'} ? ' active' : ''"
         class="sidebar-link">
        <span class="icon">👥</span> Người dùng
      </a>
      <a th:href="@{/admin/rewards}"
         th:classappend="${activeMenu == 'rewards'} ? ' active' : ''"
         class="sidebar-link">
        <span class="icon">🏆</span> Phần thưởng
      </a>
      <a th:href="@{/admin/ranking}"
         th:classappend="${activeMenu == 'ranking'} ? ' active' : ''"
         class="sidebar-link">
        <span class="icon">📊</span> Xếp hạng tháng
      </a>
      <a th:href="@{/admin/claims}"
         th:classappend="${activeMenu == 'claims'} ? ' active' : ''"
         class="sidebar-link">
        <span class="icon">🎁</span> Nhận thưởng
      </a>
    </nav>

    <!-- Main content -->
    <main class="admin-main" th:replace="${content}">
    </main>

  </div>
</div>
</body>
</html>
