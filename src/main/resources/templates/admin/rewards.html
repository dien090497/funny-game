<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main})}">
<head>
  <title>Phần thưởng — Admin</title>
</head>
<body>
<main>
  <div class="admin-page-header">
    <h1>Cấu hình phần thưởng</h1>
    <p>Đặt tiêu đề, mô tả và biểu tượng cho phần thưởng top 1–3 của từng game.</p>
  </div>

  <div th:if="${error}"   class="admin-alert error"   th:text="${error}"></div>
  <div th:if="${message}" class="admin-alert success" th:text="${message}"></div>

  <div th:each="entry : ${rewardsByGame}" style="display:flex;flex-direction:column;gap:.75rem">

    <div style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.4;padding-bottom:.4rem;border-bottom:1px solid rgba(255,255,255,.06)"
         th:text="${entry.key}"></div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:1.25rem">
      <div th:each="r : ${entry.value}"
           style="background:#161b22;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:1.25rem;display:flex;flex-direction:column;gap:.85rem">

        <div style="display:flex;align-items:center;gap:.6rem">
          <span style="font-size:1.4rem;line-height:1" th:text="${r.icon}">🏆</span>
          <span style="font-size:.7rem;font-weight:700;padding:.2rem .55rem;border-radius:20px;letter-spacing:.05em"
                th:classappend="${r.rank == 1} ? 'badge badge-gold' : (${r.rank == 2} ? 'badge badge-silver' : 'badge badge-bronze')"
                th:text="'TOP ' + ${r.rank}">TOP 1</span>
        </div>

        <form th:action="@{/admin/rewards/{id}(id=${r.id})}" method="post"
              style="display:flex;flex-direction:column;gap:.75rem">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div style="display:flex;flex-direction:column;gap:.3rem">
            <label style="font-size:.73rem;opacity:.5;text-transform:uppercase;letter-spacing:.06em">Biểu tượng</label>
            <input type="text" name="icon" th:value="${r.icon}" maxlength="5"
                   style="width:70px;padding:.5rem .75rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:7px;color:inherit;font-size:1.1rem;text-align:center;outline:none"/>
          </div>

          <div style="display:flex;flex-direction:column;gap:.3rem">
            <label style="font-size:.73rem;opacity:.5;text-transform:uppercase;letter-spacing:.06em">Tiêu đề</label>
            <input type="text" name="title" th:value="${r.title}" maxlength="100" required
                   style="padding:.5rem .75rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:7px;color:inherit;font-size:.88rem;outline:none"/>
          </div>

          <div style="display:flex;flex-direction:column;gap:.3rem">
            <label style="font-size:.73rem;opacity:.5;text-transform:uppercase;letter-spacing:.06em">Mô tả</label>
            <textarea name="description" maxlength="500" rows="3"
                      style="padding:.5rem .75rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:7px;color:inherit;font-size:.85rem;font-family:inherit;resize:vertical;outline:none"
                      th:text="${r.description}"></textarea>
          </div>

          <button type="submit"
                  style="padding:.45rem 1rem;border-radius:7px;border:1px solid rgba(63,185,80,.35);background:rgba(63,185,80,.1);color:#56d364;font-size:.82rem;font-weight:600;cursor:pointer">
            Lưu thay đổi
          </button>
        </form>
      </div>
    </div>
  </div>
</main>
</body>
</html>
