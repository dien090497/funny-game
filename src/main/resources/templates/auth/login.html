<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — Funny Game</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="logo-mark">🎮</span>
      <h1>Funny Game</h1>
      <p>Đăng nhập để chơi game và lưu điểm</p>
    </div>

    <div th:if="${error}" class="auth-alert error" th:text="${error}"></div>
    <div th:if="${message}" class="auth-alert success" th:text="${message}"></div>

    <form class="auth-form" th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input id="username" type="text" name="username"
               autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="auth-submit">Đăng nhập →</button>
    </form>

    <p class="auth-footer">
      Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
    </p>
  </div>
</body>
</html>
