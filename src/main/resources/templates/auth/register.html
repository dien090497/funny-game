<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký — Funny Game</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="logo-mark">🎮</span>
      <h1>Tạo tài khoản</h1>
      <p>Đăng ký để chơi game và lên bảng xếp hạng</p>
    </div>

    <div th:if="${error}" class="auth-alert error" th:text="${error}"></div>

    <form class="auth-form" th:action="@{/register}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input id="username" type="text" name="username"
               autocomplete="username" autofocus required
               minlength="3" maxlength="50"
               placeholder="Chỉ dùng chữ, số và dấu _">
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" name="password"
               autocomplete="new-password" required minlength="6"
               placeholder="Ít nhất 6 ký tự">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Xác nhận mật khẩu</label>
        <input id="confirmPassword" type="password" name="confirmPassword"
               autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="auth-submit">Đăng ký →</button>
    </form>

    <p class="auth-footer">
      Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
    </p>
  </div>
</body>
</html>
