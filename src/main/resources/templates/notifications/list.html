<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông báo — Funny Game</title>
  <link rel="stylesheet" th:href="@{/css/hub-nav.css}">
  <link rel="stylesheet" th:href="@{/css/notifications.css}">
</head>
<body>
  <nav class="game-hub-nav" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <a th:href="@{/}">← Trang chủ</a>
    <div class="nav-right">
      <span class="nav-user" sec:authentication="name"></span>
      <form th:action="@{/logout}" method="post" style="display:inline;margin:0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="nav-logout">Đăng xuất</button>
      </form>
    </div>
  </nav>

  <main class="notif-page">
    <div class="notif-header">
      <h1>🔔 Thông báo</h1>
      <p>Phần thưởng dành cho bạn từ các tháng thi đấu.</p>
    </div>

    <div th:if="${error}"   class="notif-alert error"   th:text="${error}"></div>
    <div th:if="${message}" class="notif-alert success" th:text="${message}"></div>

    <div th:if="${notifications.empty}" class="notif-empty">
      <span>🎮</span>
      <p>Chưa có thông báo nào. Hãy chơi game và leo lên top 3 để nhận thưởng!</p>
    </div>

    <div class="notif-list">
      <div th:each="n : ${notifications}"
           th:classappend="${!n.read} ? ' notif-unread' : ''"
           class="notif-card">

        <div class="notif-card-top">
          <span class="notif-icon" th:text="${n.rewardIcon}">🏆</span>
          <div class="notif-meta">
            <div class="notif-title">
              <span th:text="${n.rewardTitle}">Phần thưởng</span>
              <span th:if="${!n.read}" class="notif-badge-new">MỚI</span>
            </div>
            <div class="notif-sub">
              <span th:text="'Game: ' + ${n.game.toUpperCase()}">Game</span>
              <span>·</span>
              <span th:text="'Hạng ' + ${n.rank}">Hạng 1</span>
              <span>·</span>
              <span th:text="'Tháng ' + ${n.month}">Tháng</span>
            </div>
          </div>
        </div>

        <!-- Đã nhận thưởng: hiện thông tin + nút sửa -->
        <div th:if="${n.claim != null}" class="claim-info">
          <div class="claim-info-grid">
            <div><span class="ci-label">Họ tên</span><span class="ci-value" th:text="${n.claim.fullName}"></span></div>
            <div><span class="ci-label">Số điện thoại</span><span class="ci-value" th:text="${n.claim.phone}"></span></div>
            <div><span class="ci-label">Địa chỉ</span><span class="ci-value" th:text="${n.claim.address}"></span></div>
            <div><span class="ci-label">Tuổi</span><span class="ci-value" th:text="${n.claim.age}"></span></div>
          </div>
          <button type="button" class="btn-edit"
                  th:attr="data-id=${n.id},
                           data-fullname=${n.claim.fullName},
                           data-phone=${n.claim.phone},
                           data-address=${n.claim.address},
                           data-age=${n.claim.age}"
                  onclick="openForm(this)">✏️ Sửa thông tin</button>
        </div>

        <!-- Chưa nhận thưởng: nút nhận -->
        <div th:if="${n.claim == null}">
          <button type="button" class="btn-claim"
                  th:attr="data-id=${n.id}"
                  onclick="openForm(this)">🎁 Nhận thưởng</button>
        </div>

      </div>
    </div>
  </main>

  <!-- Modal form nhận/sửa thưởng -->
  <div id="claim-modal" class="modal-backdrop is-hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">🎁 Thông tin nhận thưởng</h2>
      <p class="modal-sub">Điền đầy đủ thông tin để nhận quà từ ban tổ chức.</p>

      <form id="claim-form" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
          <label for="fullName">Họ và tên</label>
          <input id="fullName" type="text" name="fullName" maxlength="100" required placeholder="Nguyễn Văn A"/>
        </div>
        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input id="phone" type="tel" name="phone" maxlength="11" required placeholder="0912345678"/>
        </div>
        <div class="form-group">
          <label for="address">Địa chỉ nhận quà</label>
          <input id="address" type="text" name="address" maxlength="255" required placeholder="123 Đường ABC, Quận 1, TP.HCM"/>
        </div>
        <div class="form-group">
          <label for="age">Tuổi</label>
          <input id="age" type="number" name="age" min="1" max="120" required placeholder="25"/>
        </div>

        <div class="modal-actions">
          <button type="button" onclick="closeModal()">Huỷ</button>
          <button type="submit" class="btn-primary">Lưu thông tin →</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const modal = document.getElementById('claim-modal');
    const form  = document.getElementById('claim-form');

    function openForm(btn) {
      const id = btn.dataset.id;
      form.action = `/notifications/${id}/claim`;
      form.fullName.value = btn.dataset.fullname || '';
      form.phone.value    = btn.dataset.phone    || '';
      form.address.value  = btn.dataset.address  || '';
      form.age.value      = btn.dataset.age      || '';
      modal.classList.remove('is-hidden');
      form.fullName.focus();
    }

    function closeModal() { modal.classList.add('is-hidden'); }

    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
